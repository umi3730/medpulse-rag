name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EMBEDDING_PROVIDER: hash
      EMBEDDING_LOCAL_FILES_ONLY: "true"
      LLM_PROVIDER: ollama
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q graphrag server knowledge_graph tests evaluation

      - name: Validate evaluation cases
        run: python -m evaluation.run_evaluation --validate-only

      - name: Run backend tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject runtime data and secrets files
        shell: bash
        run: |
          forbidden="$({
            git ls-files | grep -E '(^|/)\.env$|\.(sqlite3?|db)$|(^|/)data/medical\.json$|(^|/)(logs|data/qdrant|data/huggingface|data/pip-cache)/'
          } || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Runtime or secret-bearing files must not be committed:"
            echo "$forbidden"
            exit 1
          fi

      - name: Reject oversized tracked files
        shell: bash
        run: |
          oversized="$({
            git ls-files -z | xargs -0 -r du -b | awk '$1 > 20000000 {print $0}'
          } || true)"
          if [[ -n "$oversized" ]]; then
            echo "Tracked files larger than 20 MB are not allowed:"
            echo "$oversized"
            exit 1
          fi

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build backend frontend
